pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.google.protobuf') {
                useModule("com.google.protobuf:protobuf-gradle-plugin:${requested.version}")
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven {
            name = 'flatBuffersPinnedRuntime'
            url = uri(providers.environmentVariable('FLATBUFFERS_MAVEN_REPOSITORY')
                    .orElse('/opt/flatbuffers-maven').get())
            content {
                includeModule('com.google.flatbuffers', 'flatbuffers-java')
            }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = 'Hyperion Grabber NG'

include ':mobile', ':tv', ':common'
